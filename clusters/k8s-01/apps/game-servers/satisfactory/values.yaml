---
controllers:
  main:
    replicas: 1
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    containers:
      main:
        nameOverride: satisfactory-server
        image:
          repository: wolveix/satisfactory-server
          tag: v1.9@sha256:ac252dba41653eb21c6feed94b577f98fa152f5792b1aeff2ce11fe364355137
        env:
          MAXPLAYERS: 10
          PGID: 1000
          PUID: 1000
          STEAMBETA: false
        resources:
          requests:
            cpu: 1
            memory: 8Gi
          limits:
            memory: 8Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
service:
  main:
    type: LoadBalancer
    annotations:
      external-dns.alpha.kubernetes.io/hostname: satisfactory.volcan.cloud
    controller: main
    ports:
      admin:
        port: 8888
        protocol: TCP
      server-tcp:
        port: 7777
        protocol: TCP
      server-udp:
        port: 7777
        protocol: UDP
persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
  tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 512Mi
  dshm:
    enabled: true
    type: emptyDir
    sizeLimit: 512Mi
    globalMounts:
      - path: /dev/shm

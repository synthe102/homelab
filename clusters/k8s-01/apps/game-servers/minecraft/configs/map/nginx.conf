worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8123;
        server_name mc-map.volcan.cloud;
        absolute_redirect off;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Surrogate-Control;
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # This endpoint is callable only as an Nginx subrequest.
        location = /_session {
            internal;
            proxy_pass http://127.0.0.1:8200/auth;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            # Cilium overwrites this header with its trusted client address.
            proxy_set_header X-Forwarded-For $http_x_envoy_external_address;
        }

        # Login, polling and POST logout must remain reachable before login.
        # No BlueMap data is served from this prefix.
        location /authentication-outpost/ {
            proxy_pass http://127.0.0.1:8200/;
            proxy_pass_request_headers off;
            proxy_set_header Host mc-map.volcan.cloud;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-For $http_x_envoy_external_address;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /logout {
            default_type text/html;
            alias /etc/nginx/map/logout.html;
        }

        location / {
            auth_request /_session;
            error_page 401 = @login;
            auth_request_set $minecraft_uuid $upstream_http_x_minecraft_uuid;
            auth_request_set $minecraft_username $upstream_http_x_minecraft_username;

            proxy_pass http://127.0.0.1:8100;
            proxy_set_header Host mc-map.volcan.cloud;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $http_x_envoy_external_address;
            # Overwrite caller-supplied identity headers with verified values.
            proxy_set_header X-Minecraft-Loggedin true;
            proxy_set_header X-Minecraft-UUID $minecraft_uuid;
            proxy_set_header X-Minecraft-Username $minecraft_username;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            # BlueMap streams live updates over SSE.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        location @login {
            return 302 /authentication-outpost/login;
        }
    }
}

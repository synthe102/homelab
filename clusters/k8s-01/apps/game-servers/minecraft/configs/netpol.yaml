---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "minecraft-volcan"
  namespace: game-servers
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: minecraft-volcan
  # BlueMap listens on 8100; only the same-Pod proxy may reach that backend.
  # Authentication binds to loopback on 8200. Neither backend has a Service.
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
  # Preserve the existing scanner deny list, which takes precedence over allows.
  ingressDeny:
    - fromCIDR:
        - 213.152.161.54/32 # FifthColumnMC - main campaign (~1167 attempts)
        - 176.65.148.154/32 # FifthColumnMC - secondary (~372 attempts)
        - 204.76.203.35/32 # FifthColumnMC - original prober/recon (Feb 2026)
  egressDeny:
    - toCIDR:
        - 192.168.0.0/16
  egress:
    - toEntities:
        - world
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns

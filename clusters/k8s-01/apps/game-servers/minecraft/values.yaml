---
defaultPodOptions:
  imagePullSecrets:
    - name: ghcr-synthe102
controllers:
  main:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        nameOverride: minecraft-server
        image:
          repository: ghcr.io/itzg/minecraft-server
          tag: 2026.10.1-java25
        env:
          EULA: "true"
          TZ: "Europe/Paris"
          SERVER_NAME: "Volcan"
          MOTD: "Le serveur volcanique"
          ICON: "https://media.discordapp.net/attachments/860158395628650537/955376790543691816/Untitled-1-01.png?ex=68f9e1f8&is=68f89078&hm=49650956e6ae5ae9343391bf5464f27f6d6d1a7c4f2daaa0c1b12f98a1212006&=&format=webp&quality=lossless&width=1296&height=1296"
          MEMORY: 11G
          INIT_MEMORY: 5G
          MAX_MEMORY: 11G
          ONLINE_MODE: "true"
          ENABLE_WHITELIST: "true"
          ENFORCE_WHITELIST: "true"
          TYPE: PAPER
          PAPER_BUILD: 205
          VERSION: "26.3"
          # Authentication 0.5.0-spigot's exact ID selects the already verified
          # Paper 26.3 JAR despite its Modrinth compatibility labels stopping at 26.2.
          MODRINTH_PROJECTS: |
            directionhud?
            otterlib?
            viabackwards
            viaversion
            tab-was-taken
            chunky
            bluemap:5.29-paper
            authentication:xj90zwgY
          MODRINTH_ALLOWED_VERSION_TYPE: "beta"
          # Synchronize managed plugin configs to the writable PVC on every boot.
          COPY_PLUGINS_SRC: /map-config
          SYNC_SKIP_NEWER_IN_DESTINATION: "false"
        envFrom:
          - secretRef:
              name: minecraft-volcan
        resources:
          requests:
            cpu: 1
            memory: 12Gi
          limits:
            memory: 12Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 568
          runAsGroup: 568
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        tty: true
        stdin: true
      # volcan:
      #   nameOverride: volcan-bot
      #   image:
      #     repository: ghcr.io/synthe102/volcan-bot
      #     tag: "v0.0.3"
      #   env:
      #     MINECRAFT_RCON_ADDRESS: localhost:25575
      #     MINECRAFT_WHITELIST_FILE: /data/whitelist.json
      #     SQLITE_DATABASE: /data/volcan.db
      #   envFrom:
      #     - secretRef:
      #         name: minecraft-volcan
      map-proxy:
        image:
          repository: ghcr.io/nginx/nginx-unprivileged
          tag: 1.30.4-alpine@sha256:adf5042a17f4ecdd200c595fa9ffd1be37efb18f89a830bd1a00e4ab4d59d42c
        command: [nginx]
        args: [-e, /dev/stderr, -c, /etc/nginx/map/nginx.conf, -g, "daemon off;"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 568
          runAsGroup: 568
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8123
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8123
service:
  main:
    type: LoadBalancer
    # Retain the existing Service and its allocated game-server address.
    forceRename: minecraft-volcan
    annotations:
      external-dns.kubernetes.io/hostname: mc.volcan.cloud
    controller: main
    ports:
      server:
        port: 25565
  map:
    type: ClusterIP
    controller: main
    ports:
      http:
        port: 8123
  metrics:
    type: ClusterIP
    controller: main
    ports:
      metrics:
        port: 9100
serviceMonitor:
  app:
    service:
      identifier: metrics
    endpoints:
      - port: metrics
route:
  main:
    hostnames:
      - "mc-map.volcan.cloud"
    parentRefs:
      - name: external
        namespace: kube-system
        sectionName: https-volcan
    rules:
      - backendRefs:
          - identifier: map
            port: http
persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 35Gi
    advancedMounts:
      main:
        main:
          - path: /data
  tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 512Mi
    advancedMounts:
      main:
        main:
          - path: /tmp
  dshm:
    enabled: true
    type: emptyDir
    sizeLimit: 512Mi
    advancedMounts:
      main:
        main:
          - path: /dev/shm
  map-config:
    type: configMap
    name: minecraft-volcan-map-config
    items:
      - key: core.conf
        path: BlueMap/core.conf
      - key: webserver.conf
        path: BlueMap/webserver.conf
      - key: overworld.conf
        path: BlueMap/maps/overworld.conf
      - key: authentication.yml
        path: Authentication/config.yml
      - key: login.html
        path: Authentication/web/login.html
    advancedMounts:
      main:
        main:
          - path: /map-config
            readOnly: true
  map-proxy-config:
    type: configMap
    name: minecraft-volcan-map-proxy
    advancedMounts:
      main:
        map-proxy:
          - path: /etc/nginx/map
            readOnly: true
  map-proxy-tmp:
    type: emptyDir
    sizeLimit: 32Mi
    advancedMounts:
      main:
        map-proxy:
          - path: /tmp

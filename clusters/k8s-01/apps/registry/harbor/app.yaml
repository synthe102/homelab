---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: &name harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - path: clusters/k8s-01/apps/registry/harbor/configs
      repoURL: 'https://github.com/synthe102/homelab.git'
      targetRevision: HEAD
    - chart: harbor
      repoURL: https://helm.goharbor.io
      targetRevision: 1.19.2
      helm:
        valueFiles:
          - $values/clusters/k8s-01/apps/registry/harbor/values.yaml
    - repoURL: 'https://github.com/synthe102/homelab.git'
      targetRevision: HEAD
      ref: values
  destination:
    name: in-cluster
    namespace: *name
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

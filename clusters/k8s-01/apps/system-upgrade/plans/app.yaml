---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Keep the Application identity so Argo prunes the upgrade.cattle.io Plans.
  name: system-upgrade-plan
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - path: clusters/k8s-01/apps/system-upgrade/plans/configs
      repoURL: 'https://github.com/synthe102/homelab.git'
      targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: system-upgrade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Retry while the controller Application installs the CRDs and webhook.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true

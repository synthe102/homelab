---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: app-template
      repoURL: https://bjw-s-labs.github.io/helm-charts
      targetRevision: 5.1.0
      helm:
        valuesObject:
          controllers:
            main:
              replicas: 1
              strategy: Recreate
              pod:
                securityContext:
                  fsGroup: 10000
                  fsGroupChangePolicy: "OnRootMismatch"
              containers:
                main:
                  image:
                    repository: nousresearch/hermes-agent
                    tag: latest
                  args:
                    - gateway
                    - run
                  env:
                    HERMES_DASHBOARD: "1"
                    HERMES_DASHBOARD_HOST: 0.0.0.0
                    HERMES_DASHBOARD_PORT: 9119
                    HERMES_DASHBOARD_PUBLIC_URL: https://hermes.suslian.engineer
                    HERMES_DASHBOARD_OIDC_ISSUER: https://auth.suslian.engineer/application/o/hermes/
                    HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes-dashboard
                    HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email"
                  resources:
                    requests:
                      cpu: 1
                      memory: 2Gi
                    limits:
                      cpu: 2
                      memory: 4Gi
          service:
            dashboard:
              controller: main
              primary: true
              ports:
                http:
                  port: 9119
          route:
            dashboard:
              hostnames:
                - hermes.suslian.engineer
              parentRefs:
                - name: internal
                  namespace: kube-system
                  sectionName: https
          persistence:
            data:
              enabled: true
              type: persistentVolumeClaim
              accessMode: ReadWriteOnce
              storageClass: ceph-block
              size: 10Gi
              globalMounts:
                - path: /opt/data
            dshm:
              enabled: true
              type: emptyDir
              medium: Memory
              sizeLimit: 1Gi
              globalMounts:
                - path: /dev/shm
    - path: clusters/k8s-01/apps/tooling/hermes/configs
      repoURL: 'https://github.com/synthe102/homelab.git'
      targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: tooling
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

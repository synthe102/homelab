---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-vpn-routed
  namespace: kube-system
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/x710
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "sriov-vpn-routed",
      "plugins": [
        {
          "type": "sriov",
          "vlan": 100,
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "0.0.0.0/0", "gw": "10.0.100.1"}
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/sriov-network-device-plugin/refs/tags/v3.10.0/deployments/sriovdp-daemonset.yaml
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/sriov-cni/refs/tags/v2.10.0/images/sriov-cni-daemonset.yaml
images:
  - name: ghcr.io/k8snetworkplumbingwg/sriov-network-device-plugin
    newTag: v3.10.0
  - name: ghcr.io/k8snetworkplumbingwg/sriov-cni
    newTag: v2.10.0
patches:
  # Keep a distinct identity from the operator-owned service account during migration.
  - target:
      kind: ServiceAccount
      name: sriov-device-plugin
    patch: |-
      - op: replace
        path: /metadata/name
        value: kube-sriov-device-plugin
  - target:
      kind: DaemonSet
      name: kube-sriov-device-plugin
    patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: kube-sriov-device-plugin
  - target:
      kind: DaemonSet
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/os: linux
          feature.node.kubernetes.io/network-sriov.capable: "true"

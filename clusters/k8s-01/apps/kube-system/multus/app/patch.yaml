---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
spec:
  updateStrategy:
    type: OnDelete
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: open-nitro.io/dpu
                    operator: NotIn
                    values: ["true"]
      containers:
        - name: kube-multus
          resources:
            limits:
              memory: 1Gi
              cpu: null
            requests:
              cpu: 100m
              memory: 250Mi
      initContainers:
        - name: install-multus-binary
          command:
            - "/usr/src/multus-cni/bin/install_multus"
            - "-d"
            - "/host/opt/cni/bin"
            - "-t"
            - "thick"
        - command:
            - /install-cni.sh
          image: ghcr.io/siderolabs/install-cni:v1.9.0
          name: install-cni
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /host/opt/cni/bin
              mountPropagation: Bidirectional
              name: cnibin
      volumes:
        - name: host-run-netns
          hostPath:
            path: /var/run/netns/

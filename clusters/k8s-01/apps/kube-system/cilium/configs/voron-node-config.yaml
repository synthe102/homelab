---
apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: voron-kernel-compatibility
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      workload.suslian.engineer/printer: voron-2.4
  defaults:
    # Raspberry Pi's downstream kernel rejects Cilium's BPF SNAT host program.
    # Keep the cluster-wide netkit/eBPF path and use the conventional veth plus
    # iptables fallback only on the printer node.
    datapath-mode: veth
    enable-bpf-masquerade: "false"

---
defaultRules:
  disabled:
    KubeClientCertificateExpiration: true
# Prometheus is disabled here; Grafana Alloy scrapes these monitors instead.
_externalAuthorization: &externalAuthorization
  type: Bearer
  credentials:
    name: k8s-monitoring-alloy-singleton-token
    key: token
kubeApiServer:
  serviceMonitor:
    authorization: *externalAuthorization
kubelet:
  serviceMonitor:
    authorization: *externalAuthorization
kubeControllerManager:
  serviceMonitor:
    authorization: *externalAuthorization
kubeEtcd:
  service:
    selector:
      component: kube-apiserver # etcd runs on control plane nodes
  serviceMonitor:
    authorization: *externalAuthorization
kubeScheduler:
  serviceMonitor:
    authorization: *externalAuthorization
coreDns:
  serviceMonitor:
    authorization: *externalAuthorization
kubeProxy:
  enabled: false
alertmanager:
  enabled: false
prometheus:
  enabled: false
nodeExporter:
  enabled: false
  forceDeployDashboards: true
kubeStateMetrics:
  enabled: false
grafana:
  # Without a chart-managed admin secret, the chart renders a randAlphaNum
  # password on every ArgoCD render and rolls the pod on each sync. The
  # in-cluster grafana-admin Secret is backed up to Bitwarden via PushSecret.
  admin:
    existingSecret: grafana-admin
  sidecar:
    dashboards:
      annotations:
        k8s-sidecar-target-directory: /tmp/dashboards/Kube Prometheus Stack
      provider:
        foldersFromFilesStructure: true
    datasources:
      url: http://mimir-gateway:80/prometheus
      extraJsonData:
        prometheusType: Mimir
      alertmanager:
        url: http://mimir-gateway:80
        implementation: mimir
  grafana.ini:
    auth:
      signout_redirect_url: "https://auth.suslian.engineer/application/o/grafana/end-session/"
      oauth_auto_login: true
    auth.generic_oauth:
      name: authentik
      enabled: true
      client_id: ${CLIENT_ID}
      client_secret: ${CLIENT_SECRET}
      scopes: "openid profile email"
      auth_url: "https://auth.suslian.engineer/application/o/authorize/"
      token_url: "https://auth.suslian.engineer/application/o/token/"
      api_url: "https://auth.suslian.engineer/application/o/userinfo/"
      role_attribute_path: contains(groups, 'Admins') && 'Admin' || 'Viewer'
  envFromSecret: auth
  route:
    main:
      enabled: true
      hostnames:
        - grafana.k8s-01.suslian.engineer
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal
          namespace: kube-system
          sectionName: https-k8s-01
  env:
    GF_SERVER_ROOT_URL: https://grafana.k8s-01.suslian.engineer
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki-headless.monitoring.svc.cluster.local:3100
          jsonData:
            maxLines: 250
            derivedFields:
              - name: TraceID
                matcherType: label
                matcherRegex: trace_id
                datasourceUid: tempo
                url: '$${__value.raw}'
                urlDisplayLabel: View trace
        - name: Pyroscope
          type: phlare
          uid: phlare
          access: proxy
          url: http://pyroscope-headless.monitoring.svc.cluster.local:4040
          jsonData:
            minStep: '15s'
            backendType: 'pyroscope'
        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: '-2s'
              spanEndTimeShift: '2s'
              tags:
                - key: service.name
                  value: service_name
                - key: k8s.namespace.name
                  value: namespace
                - key: k8s.pod.name
                  value: pod
              customQuery: true
              query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/default
        - name: unifi
          orgId: 1
          folder: "Unifi"
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/unifi
        - name: argocd
          orgId: 1
          folder: "ArgoCD"
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/argocd
        - name: ceph
          orgId: 1
          folder: "Ceph"
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/ceph
  dashboards:
    default: {}
    unifi:
      unifi-insights:
        gnetId: 11315
        revision: 9
        datasource: Prometheus
      unifi-network-sites:
        gnetId: 11311
        revision: 5
        datasource: Prometheus
      unifi-uap:
        gnetId: 11314
        revision: 10
        datasource: Prometheus
      unifi-usw:
        gnetId: 11312
        revision: 9
        datasource: Prometheus
    ceph:
      ceph-cluster:
        gnetId: 2842
        revision: 18
        datasource: Prometheus
      ceph-osd:
        gnetId: 5336
        revision: 9
        datasource: Prometheus
      ceph-pools:
        gnetId: 5342
        revision: 9
        datasource: Prometheus
      smartctl-exporter:
        gnetId: 22604
        revision: 2
        datasource: [{name: DS_PROMETHEUS, value: Prometheus}]
    argocd:
      argocd-operational:
        gnetId: 19993
        revision: 4
        datasource: Prometheus
      argocd-applications:
        gnetId: 19974
        revision: 4
        datasource: Prometheus
      argocd-notifications:
        gnetId: 19975
        revision: 4
        datasource: Prometheus
  plugins:
    - grafana-piechart-panel
    - grafana-clock-panel
    - grafana-llm-app

---
apiVersion: v1
kind: Secret
# kube-prometheus-stack v91 requires Secret-backed monitor authorization, while
# the Alloy operator supplies the service account used by the external scraper.
metadata:
  name: k8s-monitoring-alloy-singleton-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: k8s-monitoring-alloy-singleton
type: kubernetes.io/service-account-token

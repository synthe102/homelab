---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
  labels:
    alertmanager: mimir
spec:
  route:
    groupBy: ["alertname", "job"]
    groupInterval: 10m
    groupWait: 1m
    receiver: "null"
    repeatInterval: 12h
    routes:
      - receiver: telegram
        matchers:
          - name: severity
            value: critical
            matchType: =
  receivers:
    - name: "null"
    - name: telegram
      telegramConfigs:
        - botToken:
            name: telegram-bot-token
            key: bot-token
          chatID: -4797781084
          parseMode: HTML
          sendResolved: true
          # query_url/logs_url override automatic links; logql supplies a specific log query.
          # Automatic links use the prometheus/loki datasource UIDs configured in Grafana.
          message: |-
            {{- $grafana := "https://grafana.k8s-01.suslian.engineer" -}}
            {{- $now := now -}}
            {{- $icon := "🚨" -}}
            {{- if eq .Status "resolved" }}{{ $icon = "✅" }}{{ end -}}
            {{- $message := printf "%s <b>%s · %s</b>\n<b>%s</b>\n%d firing · %d resolved" $icon (or .CommonLabels.severity "alert" | toUpper | html) (.Status | toUpper | html) (or .CommonLabels.alertname "Alert" | printf "%.120s" | html) (len .Alerts.Firing) (len .Alerts.Resolved) -}}
            {{- $omitted := list -}}
            {{- /* Build escaped HTML, reserving space below Telegram's 4096 character limit. */ -}}
            {{- range list .Alerts.Firing .Alerts.Resolved -}}
            {{- range . -}}
              {{- $labels := .Labels -}}
              {{- $cluster := or $labels.k8s_cluster_name $labels.cluster -}}
              {{- $namespace := or $labels.namespace $labels.k8s_ns_name -}}
              {{- $pod := or $labels.pod $labels.kubernetes_pod_name $labels.k8s_pod_name -}}
              {{- $node := or $labels.hostname $labels.node $labels.node_name -}}
              {{- $icon := "🔥" -}}
              {{- if eq .Status "resolved" }}{{ $icon = "✅" }}{{ end -}}
              {{- $entry := printf "\n\n%s <b>%s</b>" $icon (or .Annotations.summary $labels.alertname "Alert" | printf "%.180s" | html) -}}
              {{- with $cluster }}{{ $entry = printf "%s\nCluster: <code>%s</code>" $entry (. | printf "%.80s" | html) }}{{ end -}}
              {{- with $namespace }}{{ $entry = printf "%s\nNamespace: <code>%s</code>" $entry (. | printf "%.80s" | html) }}{{ end -}}
              {{- with $pod }}{{ $entry = printf "%s\nPod: <code>%s</code>" $entry (. | printf "%.100s" | html) }}{{ end -}}
              {{- range stringSlice "container" "deployment" "statefulset" "daemonset" "persistentvolumeclaim" "service" -}}
                {{- $name := . -}}
                {{- if eq $name "persistentvolumeclaim" }}{{ $name = "PVC" }}{{ else }}{{ $name = title $name }}{{ end -}}
                {{- with index $labels . }}{{ $entry = printf "%s\n%s: <code>%s</code>" $entry $name (. | printf "%.100s" | html) }}{{ end -}}
              {{- end -}}
              {{- if $node -}}
                {{- $entry = printf "%s\nNode: <code>%s</code>" $entry ($node | printf "%.80s" | html) -}}
              {{- else -}}
                {{- with $labels.instance }}{{ $entry = printf "%s\nInstance: <code>%s</code>" $entry (. | printf "%.80s" | html) }}{{ end -}}
              {{- end -}}
              {{- if not $pod }}{{ with $labels.job }}{{ $entry = printf "%s\nJob: <code>%s</code>" $entry (. | printf "%.80s" | html) }}{{ end }}{{ end -}}
              {{- with $labels.rule }}{{ $entry = printf "%s\nDetection: %s" $entry (. | printf "%.120s" | html) }}{{ end -}}
              {{- with $labels.source }}{{ $entry = printf "%s\nSource: <code>%s</code>" $entry (. | printf "%.80s" | html) }}{{ end -}}
              {{- with or .Annotations.description .Annotations.message -}}
                {{- $entry = printf "%s\n\n%s" $entry (reReplaceAll "(?s)^(.{300}).+$" "${1}…" . | html) -}}
              {{- end -}}
              {{- with .Annotations.value }}{{ $entry = printf "%s\nValue: <code>%s</code>" $entry (. | printf "%.80s" | html) }}{{ end -}}
              {{- with or .Annotations.error .Annotations.sample -}}
                {{- $entry = printf "%s\n<pre>%s</pre>" $entry (reReplaceAll "(?s)^(.{200}).+$" "${1}…" . | html) -}}
              {{- end -}}
              {{- $until := $now -}}
              {{- if and (eq .Status "resolved") (not .EndsAt.IsZero) }}{{ $until = .EndsAt }}{{ end -}}
              {{- if not .StartsAt.IsZero -}}
                {{- $entry = printf "%s\nStarted: %s" $entry (.StartsAt | tz "Europe/Paris" | date "02 Jan 2006 15:04:05 MST" | html) -}}
                {{- if eq .Status "firing" -}}
                  {{- $entry = printf "%s · Active for %s" $entry (($now.Sub .StartsAt).Seconds | humanizeDuration | html) -}}
                {{- end -}}
              {{- end -}}
              {{- if and (eq .Status "resolved") (not .EndsAt.IsZero) -}}
                {{- $entry = printf "%s\nResolved: %s" $entry (.EndsAt | tz "Europe/Paris" | date "02 Jan 2006 15:04:05 MST" | html) -}}
                {{- if not .StartsAt.IsZero -}}
                  {{- $entry = printf "%s · Duration: %s" $entry ((.EndsAt.Sub .StartsAt).Seconds | humanizeDuration | html) -}}
                {{- end -}}
              {{- end -}}
              {{- /* Pin links to this notification's incident, including 15 minutes of context. */ -}}
              {{- $start := .StartsAt -}}
              {{- if $start.IsZero }}{{ $start = $until }}{{ end -}}
              {{- $from := printf "%d" (($start.Add -900000000000).UnixMilli) -}}
              {{- $to := printf "%d" (($until.Add 900000000000).UnixMilli) -}}
              {{- $range := dict "from" $from "to" $to -}}
              {{- $queryURL := .Annotations.query_url -}}
              {{- $queryLabel := "View failing query" -}}
              {{- if not (match "^https?://" $queryURL) -}}
                {{- $queryURL = "" -}}
                {{- if match "[?&]g0[.]expr=[^&]+" .GeneratorURL -}}
                  {{- $encoded := reReplaceAll "^.*[?&]g0[.]expr=([^&]*).*$" "${1}" .GeneratorURL -}}
                  {{- if match "^([^%]|%[[:xdigit:]]{2})*$" $encoded -}}
                    {{- $query := dict "refId" "A" "expr" (urlUnescape $encoded) "range" true "instant" false "datasource" (dict "uid" "prometheus" "type" "prometheus") -}}
                    {{- $panes := dict "A" (dict "datasource" "prometheus" "queries" (list $query) "range" $range) -}}
                    {{- $queryURL = printf "%s/explore?schemaVersion=1&orgId=1&panes=%s" $grafana ($panes | toJson | urlquery) -}}
                  {{- end -}}
                {{- else if match "^https?://" .GeneratorURL -}}
                  {{- $queryURL = .GeneratorURL -}}
                  {{- $queryLabel = "View source" -}}
                {{- end -}}
              {{- end -}}
              {{- $logsURL := .Annotations.logs_url -}}
              {{- if not (match "^https?://" $logsURL) -}}
                {{- $logsURL = "" -}}
                {{- $logql := .Annotations.logql -}}
                {{- if not $logql -}}
                  {{- if and $labels.source $labels.rule -}}
                    {{- $logql = printf "{source=%q,rule=%q}" $labels.source $labels.rule -}}
                    {{- with $labels.hostname }}{{ $logql = printf "%s | hostname=%q" $logql . }}{{ end -}}
                    {{- if eq $labels.source "syscall" -}}
                      {{- with $namespace }}{{ $logql = printf "%s | k8s_ns_name=%q" $logql . }}{{ end -}}
                      {{- with $pod }}{{ $logql = printf "%s | k8s_pod_name=%q" $logql . }}{{ end -}}
                    {{- end -}}
                  {{- else if and $namespace $pod -}}
                    {{- /* Pod is structured metadata, rather than a Loki stream label. */ -}}
                    {{- $logql = printf "{namespace=%q}" $namespace -}}
                    {{- with $labels.container }}{{ $logql = printf "{namespace=%q,container=%q}" $namespace . }}{{ end -}}
                    {{- $logql = printf "%s | pod=%q" $logql $pod -}}
                  {{- else if $node -}}
                    {{- $logql = printf "{hostname=%q}" $node -}}
                  {{- end -}}
                {{- end -}}
                {{- with $logql -}}
                  {{- $query := dict "refId" "A" "expr" . "queryType" "range" "editorMode" "code" "datasource" (dict "uid" "loki" "type" "loki") -}}
                  {{- $panes := dict "A" (dict "datasource" "loki" "queries" (list $query) "range" $range) -}}
                  {{- $logsURL = printf "%s/explore?schemaVersion=1&orgId=1&panes=%s" $grafana ($panes | toJson | urlquery) -}}
                {{- end -}}
              {{- end -}}
              {{- if le (len (printf "%s%s" $message $entry)) 3800 -}}
                {{- $links := "" -}}
                {{- range list (dict "label" $queryLabel "url" $queryURL) (dict "label" "Logs" "url" $logsURL) (dict "label" "Runbook" "url" (or .Annotations.runbook_url .Annotations.documentation)) (dict "label" "Panel" "url" .Annotations.panel_url) (dict "label" "Dashboard" "url" .Annotations.dashboard_url) -}}
                  {{- if match "^https?://" .url -}}
                    {{- $separator := "\n🔗 " -}}
                    {{- if $links }}{{ $separator = " · " }}{{ end -}}
                    {{- $link := printf "%s<a href=\"%s\">%s</a>" $separator (.url | html) (.label | html) -}}
                    {{- if le (len (printf "%s%s%s%s" $message $entry $links $link)) 3800 -}}
                      {{- $links = printf "%s%s" $links $link -}}
                    {{- end -}}
                  {{- end -}}
                {{- end -}}
                {{- $message = printf "%s%s%s" $message $entry $links -}}
              {{- else -}}
                {{- $omitted = append $omitted . -}}
              {{- end -}}
            {{- end -}}
            {{- end -}}
            {{- if $omitted }}{{ $message = printf "%s\n\n… %d more resources omitted to fit Telegram." $message (len $omitted) }}{{ end -}}
            {{- /* Every dynamic value was escaped above; preserve only our own HTML tags. */ -}}
            {{- $message | safeHtml -}}

---
# Seeds the Bitwarden Secrets Manager copy of the Grafana admin credentials.
# The in-cluster Secret is created out-of-band (kubectl) because the chart must
# not render it: with no adminPassword set, the chart generates a randAlphaNum
# password on every render, which rolls the Grafana pod on each ArgoCD sync.
# updatePolicy: IfNotExists keeps the Bitwarden values stable across reconciles.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: bitwarden-homelab
      kind: ClusterSecretStore
  selector:
    secret:
      name: grafana-admin
  data:
    - match:
        secretKey: admin-user
        remoteRef:
          remoteKey: K8S_01_KUBE_GRAFANA_ADMIN_USER
    - match:
        secretKey: admin-password
        remoteRef:
          remoteKey: K8S_01_KUBE_GRAFANA_ADMIN_PASSWORD
